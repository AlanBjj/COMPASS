# Baselines on strategyqa with the ministral-8b backbone: the same backbone, judge, retrieval corpus and
# benchmark date as COMPASS in configs/ministral-8b/strategyqa.yaml. Generated by scripts/make_configs.py.
run:
  name: baselines
  seed: 0
  sample_size: null
  checkpoint_every: 100

models:
  backbone: {base_url: http://localhost:8102/v1, model: ministral-8b-instruct, temperature: 0.0, max_tokens: 2048}
  judge:    {base_url: http://localhost:8200/v1, model: qwen3-32b, local: true, enable_thinking: false, temperature: 0.0, max_tokens: 512, request_timeout: 120}

client: {concurrency: 16, retries: 3}

# Per-baseline hyperparameters (faithful to the official implementations; adaptations are
# documented in each module of compass/baselines/). Pick the method with `--method`.
methods:
  direct: {}
  adaptive_rag: {max_num_sentences: 10, single_top_k: 5, ircot_top_k: 6}
  react: {max_steps: 7, top_k: 5}
  self_consistency: {num_samples: 5, sample_temperature: 0.7}  # k CoT samples + majority vote (k/temperature as in TRACE)
  targ: {draft_tokens: 20, beta: 3.0, top_k: 5, tau: 1000000000.0}   # TARG (arXiv 2511.09803), margin gate
  targ_never: {draft_tokens: 20, beta: 3.0, top_k: 5, force: never}    # calibration branch
  targ_always: {draft_tokens: 20, beta: 3.0, top_k: 5, force: always}  # calibration branch
  dtr: {top_n: 5, top_k: 3, ais: angle, pseudo_query_chars: 2000, embed_url: http://localhost:8300/v1, embed_model: bge-m3, tau: 1000000000.0}   # DTR (arXiv 2601.03908)
  dtr_never: {top_n: 5, top_k: 3, ais: angle, pseudo_query_chars: 2000, embed_url: http://localhost:8300/v1, embed_model: bge-m3, force: never}    # calibration branch
  dtr_always: {top_n: 5, top_k: 3, ais: angle, pseudo_query_chars: 2000, embed_url: http://localhost:8300/v1, embed_model: bge-m3, force: always}  # calibration branch

retrieval: {backend: local_snapshot, corpus: data/snapshot_corpus/corpus.jsonl, index_dir: data/snapshot_corpus/bm25, num_results: 5}

dataset: {name: strategyqa, path: data/strategyqa/strategyqa.json, split: dev, dev_size: 100}
output: {dir: results/ministral-8b/baselines}
